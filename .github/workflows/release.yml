name: "Create Release"

on:
  push:
    tags: ["v*"]
  # Manual runs from the Actions tab. Select the tag in "Use workflow from";
  # GITHUB_REF_NAME / github.ref resolve from it (asset names + release tag).
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
