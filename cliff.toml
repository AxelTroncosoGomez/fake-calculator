[changelog]
header = "# Changelog\n\nAll notable changes to this project will be documented in this file.\n\n"
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
  {%- if commit.scope -%}
- *({{ commit.scope }})* {{ commit.message | upper_first }}
  {%- else -%}
- {{ commit.message | upper_first }}
  {%- endif -%}
{%- endfor %}
{% endfor %}
"""
trim = true
footer = ""

[git]
conventional_commits = true
filter_unconventional = false
split_commits = false
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->Features" },
  { message = "^fix", group = "<!-- 1 -->Bug Fixes" },
  { message = "^perf", group = "<!-- 2 -->Performance Improvements" },
  { message = "^refactor", group = "<!-- 3 -->Refactoring" },
  { message = "^docs", group = "<!-- 4 -->Documentation" },
  { message = "^test", group = "<!-- 5 -->Testing" },
  { message = "^build", group = "<!-- 6 -->Build System" },
  { message = "^ci", group = "<!-- 7 -->Continuous Integration" },
  { message = "^chore", group = "<!-- 8 -->Miscellaneous Tasks" },
  { message = "^revert", group = "<!-- 9 -->Reverts" },
]
default_group = "<!-- 99 -->Other Changes"
protect_breaking_commit_label = false
filter_commits = false
sort_commits = "oldest"
topo_order = false
